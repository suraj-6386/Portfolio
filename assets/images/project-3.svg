<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p3Bg)"/>
  
  <!-- Dashboard Top Bar -->
  <rect x="24" y="24" width="552" height="40" rx="8" fill="#131d33" stroke="rgba(148,163,184,0.1)" stroke-width="1"/>
  <circle cx="44" cy="44" r="6" fill="#ef4444"/>
  <circle cx="62" cy="44" r="6" fill="#f59e0b"/>
  <circle cx="80" cy="44" r="6" fill="#10b981"/>
  <text x="110" y="49" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Automated Data Pipeline &amp; Web Intelligence ETL</text>
  <rect x="470" y="34" width="90" height="20" rx="4" fill="#0284c7" fill-opacity="0.2"/>
  <text x="515" y="48" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PYTHON / SQL</text>

  <!-- Flow Pipeline diagram -->
  <g transform="translate(24, 76)">
    <!-- Stage 1: Web Scraper / API -->
    <rect x="0" y="0" width="160" height="260" rx="8" fill="#131d33" stroke="rgba(148,163,184,0.1)"/>
    <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">1. Data Extraction</text>
    
    <g transform="translate(16, 46)">
      <rect width="128" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="22" fill="#f8fafc" font-family="monospace" font-size="10">Web Crawler</text>
      
      <rect y="48" width="128" height="36" rx="6" fill="#1e293b" stroke="rgba(148,163,184,0.2)"/>
      <text x="12" y="70" fill="#94a3b8" font-family="monospace" font-size="10">REST API Ingestion</text>

      <rect y="96" width="128" height="36" rx="6" fill="#1e293b" stroke="rgba(148,163,184,0.2)"/>
      <text x="12" y="118" fill="#94a3b8" font-family="monospace" font-size="10">HTML / JSON Parsing</text>

      <rect y="144" width="128" height="36" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-dasharray="2 2"/>
      <text x="12" y="166" fill="#38bdf8" font-family="monospace" font-size="10">Status: 200 OK</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 166 130 L 190 130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2: Data Cleaning & SQL Transformation -->
    <g transform="translate(196, 0)">
      <rect width="160" height="260" rx="8" fill="#131d33" stroke="rgba(148,163,184,0.1)"/>
      <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">2. Transformation</text>
      
      <g transform="translate(16, 46)">
        <rect width="128" height="36" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
        <text x="12" y="22" fill="#f8fafc" font-family="monospace" font-size="10">Pandas Cleaning</text>
        
        <rect y="48" width="128" height="36" rx="6" fill="#1e293b" stroke="rgba(148,163,184,0.2)"/>
        <text x="12" y="70" fill="#94a3b8" font-family="monospace" font-size="10">Schema Validation</text>

        <rect y="96" width="128" height="36" rx="6" fill="#1e293b" stroke="rgba(148,163,184,0.2)"/>
        <text x="12" y="118" fill="#94a3b8" font-family="monospace" font-size="10">SQL Warehouse</text>

        <rect y="144" width="128" height="36" rx="6" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-dasharray="2 2"/>
        <text x="12" y="166" fill="#a5b4fc" font-family="monospace" font-size="10">Deduplicated</text>
      </g>
    </g>

    <!-- Stage 3: Analytics Output -->
    <g transform="translate(392, 0)">
      <rect width="160" height="260" rx="8" fill="#131d33" stroke="rgba(148,163,184,0.1)"/>
      <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">3. Analytics &amp; BI</text>
      
      <g transform="translate(16, 46)">
        <rect width="128" height="36" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
        <text x="12" y="22" fill="#f8fafc" font-family="monospace" font-size="10">Power BI Model</text>
        
        <rect y="48" width="128" height="36" rx="6" fill="#1e293b" stroke="rgba(148,163,184,0.2)"/>
        <text x="12" y="70" fill="#94a3b8" font-family="monospace" font-size="10">KPI Dashboards</text>

        <rect y="96" width="128" height="36" rx="6" fill="#1e293b" stroke="rgba(148,163,184,0.2)"/>
        <text x="12" y="118" fill="#94a3b8" font-family="monospace" font-size="10">Automated Alerts</text>

        <rect y="144" width="128" height="36" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-dasharray="2 2"/>
        <text x="12" y="166" fill="#34d399" font-family="monospace" font-size="10">Live Ingestion</text>
      </g>
    </g>
  </g>
</svg>
