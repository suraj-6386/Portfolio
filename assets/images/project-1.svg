    <line x1="20" y1="130" x2="340" y2="130" stroke="rgba(148,163,184,0.06)"/>
    <line x1="20" y1="160" x2="340" y2="160" stroke="rgba(148,163,184,0.15)"/>

    <!-- Bars -->
    <rect x="35" y="90" width="18" height="70" rx="3" fill="url(#barGrad1)"/>
    <rect x="65" y="70" width="18" height="90" rx="3" fill="url(#barGrad1)"/>
    <rect x="95" y="105" width="18" height="55" rx="3" fill="url(#barGrad1)"/>
    <rect x="125" y="60" width="18" height="100" rx="3" fill="url(#barGrad1)"/>
    <rect x="155" y="45" width="18" height="115" rx="3" fill="url(#barGrad1)"/>
    <rect x="185" y="80" width="18" height="80" rx="3" fill="url(#barGrad1)"/>
    <rect x="215" y="55" width="18" height="105" rx="3" fill="url(#barGrad1)"/>
    <rect x="245" y="40" width="18" height="120" rx="3" fill="url(#barGrad1)"/>
    <rect x="275" y="65" width="18" height="95" rx="3" fill="url(#barGrad1)"/>
    <rect x="305" y="35" width="18" height="125" rx="3" fill="url(#barGrad1)"/>

    <!-- Trend Line -->
    <path d="M 44 80 Q 100 60, 164 40 T 254 30 T 314 25" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="314" cy="25" r="4" fill="#34d399"/>
  </g>

  <!-- Donut / Category Breakdown -->
  <g transform="translate(404, 152)">
    <rect width="172" height="184" rx="8" fill="#131d33" stroke="rgba(148,163,184,0.1)"/>
    <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Category Share</text>
    
    <circle cx="86" cy="95" r="45" fill="none" stroke="#1e293b" stroke-width="16"/>
    <circle cx="86" cy="95" r="45" fill="none" stroke="#38bdf8" stroke-width="16" stroke-dasharray="140 282" stroke-dashoffset="0"/>
    <circle cx="86" cy="95" r="45" fill="none" stroke="#818cf8" stroke-width="16" stroke-dasharray="80 282" stroke-dashoffset="-145"/>
    <circle cx="86" cy="95" r="45" fill="none" stroke="#34d399" stroke-width="16" stroke-dasharray="50 282" stroke-dashoffset="-230"/>
    <text x="86" y="99" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">100%</text>

    <g transform="translate(16, 154)">
      <circle cx="4" cy="4" r="4" fill="#38bdf8"/>
      <text x="14" y="7" fill="#94a3b8" font-family="sans-serif" font-size="9">Electronics</text>
      <circle cx="84" cy="4" r="4" fill="#818cf8"/>
      <text x="94" y="7" fill="#94a3b8" font-family="sans-serif" font-size="9">Apparel</text>
    </g>
