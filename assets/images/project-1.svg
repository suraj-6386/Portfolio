  <circle cx="62" cy="44" r="6" fill="#f59e0b"/>
  <circle cx="80" cy="44" r="6" fill="#10b981"/>
  <text x="110" y="49" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Retail Sales Performance &amp; Revenue Analytics</text>
  <rect x="490" y="34" width="70" height="20" rx="4" fill="#0284c7" fill-opacity="0.2"/>
  <text x="525" y="48" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">POWER BI</text>

  <!-- Metric Cards -->
  <g transform="translate(24, 76)">
    <rect width="170" height="64" rx="8" fill="#131d33" stroke="rgba(148,163,184,0.1)"/>
    <text x="14" y="22" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">TOTAL REVENUE</text>
    <text x="14" y="46" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Sales Trend</text>
    <text x="115" y="46" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">↑ Analyzed</text>
  </g>
  <g transform="translate(214, 76)">
    <rect width="170" height="64" rx="8" fill="#131d33" stroke="rgba(148,163,184,0.1)"/>
    <text x="14" y="22" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">DATASET SCALE</text>
    <text x="14" y="46" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">SQL Database</text>
    <text x="125" y="46" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">Cleaned</text>
  </g>
  <g transform="translate(404, 76)">
    <rect width="172" height="64" rx="8" fill="#131d33" stroke="rgba(148,163,184,0.1)"/>
    <text x="14" y="22" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">REGIONAL KPI</text>
    <text x="14" y="46" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Multi-Channel</text>
    <text x="120" y="46" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="600">KPI Sync</text>
  </g>

