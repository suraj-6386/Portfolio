<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  
  <!-- Background Card -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Subtle Tech Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
  </g>

  <!-- Outer Ring -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="8 6"/>
  
  <!-- Avatar Silhouette / User Representation -->
  <circle cx="200" cy="140" r="50" fill="url(#accentGrad)" opacity="0.9"/>
  <path d="M 120 270 C 120 215, 280 215, 280 270 Z" fill="url(#accentGrad)" opacity="0.9"/>
  
  <!-- Data Chart Icon Overlay -->
  <g transform="translate(250, 220)">
    <rect width="70" height="50" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="12" y="26" width="8" height="16" rx="2" fill="#38bdf8"/>
    <rect x="26" y="16" width="8" height="26" rx="2" fill="#60a5fa"/>
    <rect x="40" y="20" width="8" height="22" rx="2" fill="#38bdf8"/>
    <rect x="54" y="10" width="8" height="32" rx="2" fill="#93c5fd"/>
  </g>

  <!-- Tagline Badge -->
  <g transform="translate(100, 325)">
    <rect width="200" height="36" rx="18" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <text x="100" y="23" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5">SURAJ • DATA ANALYST</text>
  </g>
</svg>
